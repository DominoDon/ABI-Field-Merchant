<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ABI Mini</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
    :root { --bg: #0b0e12; --panel: #141920; --line: rgba(255,255,255,.08); --text: #e9edf2; --text-2: #b5bdc8; --dim: #7d8794; --faint: #4c5562;
      --gold: #f2b84b; --gold-2: #ffd679; --sel: rgba(226,232,240,.62); --skip: #94a3b8; --good: #3ddc97; --warn: #f5a742; --bad: #ff5c6c;
      --r1: #aeb6c1; --r2: #4fcf73; --r3: #4aa3ff; --r4: #b57bff; --r5: #f7c045; --r6: #ff4d5e;
      --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; --font-d: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(400px 300px at 0 0, rgba(242,184,75,.08), transparent 70%), var(--bg); color: var(--text); font: 13px/1.4 var(--font); -webkit-font-smoothing: antialiased; user-select: none; }
    .num { font-variant-numeric: tabular-nums; }
    .wrap { height: 100vh; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
    .wrap > * { flex: none; }
    .head { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
    .dot.on { background: var(--good); box-shadow: 0 0 8px rgba(61,220,151,.7); }
    .head .st { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
    /* decision first: verdict | expected profit + ROI | red chance + confidence (same order as the main window) */
    .signal { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 10px 12px; }
    .m { min-width: 0; } .m + .m { border-left: 1px solid var(--line); padding-left: 11px; }
    .m .k { display: block; font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
    .m .v { display: block; font: 800 25px/1.15 var(--font-d); letter-spacing: -.01em; white-space: nowrap; }
    .m .s { display: block; font-size: 11px; color: var(--text-2); white-space: nowrap; }
    .m.buy .v { color: var(--good); } .m.maybe .v { color: var(--warn); font-size: 21px; line-height: 1.37; } .m.skip .v { color: var(--skip); }
    .gain { color: var(--good); } .loss { color: var(--skip); }
    .m.red .v { color: var(--r6); } .m.red.zero .v { color: var(--faint); }
    .signal.alert-good { border-color: rgba(61,220,151,.55); box-shadow: inset 3px 0 0 var(--good); }
    .signal.alert-red { border-color: rgba(255,77,94,.6); box-shadow: inset -3px 0 0 var(--r6), 0 0 22px -8px rgba(255,77,94,.6); }
    .sname { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 7px; min-width: 0; }
    .sname .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cert { flex: none; font-size: 10.5px; font-weight: 700; padding: 2px 6px; border-radius: 5px; border: 1px solid var(--sel); color: var(--text); }
    .cert.weak { border-color: rgba(255,255,255,.14); color: var(--text-2); }
    .heard { margin-left: auto; flex: none; font-size: 11px; font-weight: 500; color: var(--dim); }
    .alts { color: var(--warn); font-size: 11.5px; margin-top: 3px; }
    .crate { color: var(--text-2); font-size: 12px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wrap > .items { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
    .items { display: flex; flex-direction: column; gap: 4px; padding-top: 7px; padding-bottom: 7px; }
    .it { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; }
    .it img { width: 26px; height: 26px; object-fit: contain; }
    .it .n { font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid var(--rc); padding-left: 7px; }
    .it .p { font-weight: 800; color: var(--text); font-size: 13px; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #2a313c; border-radius: 6px; } ::-webkit-scrollbar-track { background: transparent; }
    .empty { color: var(--dim); text-align: center; padding: 18px 6px; font-size: 12.5px; }
  </style>
</head>
<body>
  <div class="wrap" id="root"><div class="empty">Waiting for the main window…<br>(keep ABI Field Merchant open or hidden in the tray)</div></div>
  <script>
    // Mirrors the main window (BroadcastChannel) - it does no listening of its own.
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const fmt = (n) => Math.round(n).toLocaleString('en-US');
    const pct = (v) => (v > 0 && v < 0.01 ? '<1' : String(Math.round(v * 100)));
    const bc = new BroadcastChannel('abi-live');
    let last = 0;
    bc.onmessage = (e) => { if (e.data && e.data.type === 'state') { last = Date.now(); draw(e.data.s); } };
    bc.postMessage({ type: 'hello' });
    setInterval(() => { if (Date.now() - last > 5000) bc.postMessage({ type: 'hello' }); }, 2500);
    const signed = (n) => `${n >= 0 ? '+' : '−'}${fmt(Math.abs(n))}`;
    const cap = (w) => w[0].toUpperCase() + w.slice(1);
    function draw(s) {
      const v = s.verdict, snd = s.sound;
      const word = snd ? (snd.meta || '').replace(' ✓', '') : '';
      document.getElementById('root').innerHTML = `
        <div class="head"><span class="dot ${s.listening ? 'on' : ''}"></span>ABI Mini<span class="st">${esc(s.status || '')}</span></div>
        ${v ? `<div class="card signal ${v.alert ? 'alert-' + v.alert : ''}">
          <div class="m ${v.tag}"><span class="k">Verdict</span><span class="v">${{ buy: 'BUY', maybe: 'GAMBLE', skip: 'SKIP' }[v.tag]}</span></div>
          <div class="m"><span class="k">Exp. profit</span><span class="v num ${v.profit >= 0 ? 'gain' : 'loss'}">${signed(v.profit)}</span><span class="s num">ROI ${esc(v.roi || '')}</span></div>
          <div class="m red ${v.red > 0 ? '' : 'zero'}"><span class="k">Red</span><span class="v num">${pct(v.red)}%</span><span class="s">${v.conf ? cap(v.conf) + ' conf.' : '&nbsp;'}</span></div>
        </div>` : ''}
        <div class="card">
          <div class="sname"><span class="nm">${snd ? esc(snd.name) : 'Drag a crate'}</span>${snd ? `<span class="cert ${snd.level < 0.8 ? 'weak' : ''}">${esc(word === 'By hand' ? 'By hand' : word)}</span>` : ''}
            <span class="heard">${snd ? (snd.meta === 'By hand' ? 'Chosen by hand' : /✓/.test(snd.meta || '') ? 'Confirmed by drop ✓' : 'Heard just now') : 'Listening…'}</span></div>
          ${snd && snd.alts ? `<div class="alts">Close call: ${esc(snd.alts)}</div>` : ''}
          ${s.crate ? `<div class="crate">${esc(s.crate)}</div>` : ''}
        </div>
        ${s.items && s.items.length ? `<div class="card items">${s.items.map(i => `<div class="it" style="--rc:var(--r${i.rarity})"><img src="${esc(i.icon)}" alt="" onerror="this.style.visibility='hidden'"/><span class="n">${esc(i.name)}</span><span class="p num">${i.p !== null ? pct(i.p) + '%' : fmt(i.value)}</span></div>`).join('')}</div>` : ''}`;
    }
  </script>
</body>
</html>
