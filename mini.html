<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ABI Mini</title>
  <style>
    :root { --bg: #0b0e12; --panel: #141920; --line: rgba(255,255,255,.08); --text: #e9edf2; --text-2: #b5bdc8; --dim: #7d8794; --faint: #4c5562;
      --gold: #f2b84b; --gold-2: #ffd679; --good: #3ddc97; --warn: #f5a742; --bad: #ff5c6c;
      --r1: #aeb6c1; --r2: #4fcf73; --r3: #4aa3ff; --r4: #b57bff; --r5: #f7c045; --r6: #ff4d5e;
      --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; --font-d: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(400px 300px at 0 0, rgba(242,184,75,.08), transparent 70%), var(--bg); color: var(--text); font: 13px/1.4 var(--font); -webkit-font-smoothing: antialiased; user-select: none; }
    .num { font-variant-numeric: tabular-nums; }
    .wrap { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .head { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
    .dot.on { background: var(--good); box-shadow: 0 0 8px rgba(61,220,151,.7); }
    .head .st { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
    .sound { display: flex; align-items: center; gap: 12px; }
    .sid { font: 800 13px/1.1 var(--font-d); color: var(--gold-2); width: 64px; text-align: center; padding: 14px 4px; border-radius: 50%; border: 3px solid var(--gold-2); }
    .sid.weak { color: var(--muted); border-color: var(--muted); }
    .sid.idle { color: var(--faint); border-color: var(--faint); font-size: 20px; }
    .sname { font-weight: 700; font-size: 14px; }
    .smeta { color: var(--dim); font-size: 11.5px; }
    .alts { color: var(--warn); font-size: 11.5px; margin-top: 3px; }
    .crate { color: var(--text-2); font-size: 12px; margin-top: 8px; }
    .verdict { display: flex; align-items: center; gap: 10px; }
    .badge { font: 800 11px/1 var(--font-d); letter-spacing: .12em; padding: 5px 8px; border-radius: 7px; }
    .badge.buy { background: rgba(61,220,151,.14); color: var(--good); } .badge.maybe { background: rgba(245,167,66,.14); color: var(--warn); } .badge.skip { background: rgba(255,92,108,.14); color: var(--bad); }
    .profit { font: 800 24px/1 var(--font-d); }
    .profit.good { color: var(--good); } .profit.bad { color: var(--bad); }
    .red { margin-left: auto; text-align: right; }
    .red b { display: block; font: 800 22px/1 var(--font-d); color: var(--r6); }
    .red b.zero { color: var(--faint); }
    .red span { font-size: 10px; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
    .items { display: flex; flex-direction: column; gap: 6px; }
    .it { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; }
    .it img { width: 30px; height: 30px; object-fit: contain; }
    .it .n { font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 2px solid var(--rc); padding-left: 6px; }
    .it .p { font-weight: 800; color: var(--gold-2); font-size: 12.5px; }
    .empty { color: var(--dim); text-align: center; padding: 18px 6px; font-size: 12.5px; }
  </style>
</head>
<body>
  <div class="wrap" id="root"><div class="empty">Waiting for the main window…<br>(keep ABI Field Merchant open or hidden in the tray)</div></div>
  <script>
    // Mirrors the main window (BroadcastChannel) - it does no listening of its own.
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const fmt = (n) => Math.round(n).toLocaleString('en-US');
    const pct = (v) => (v > 0 && v < 0.01 ? '<1' : String(Math.round(v * 100)));
    const bc = new BroadcastChannel('abi-live');
    let last = 0;
    bc.onmessage = (e) => { if (e.data && e.data.type === 'state') { last = Date.now(); draw(e.data.s); } };
    bc.postMessage({ type: 'hello' });
    setInterval(() => { if (Date.now() - last > 5000) bc.postMessage({ type: 'hello' }); }, 2500);
    function draw(s) {
      const v = s.verdict;
      document.getElementById('root').innerHTML = `
        <div class="head"><span class="dot ${s.listening ? 'on' : ''}"></span>ABI Mini<span class="st">${esc(s.status || '')}</span></div>
        <div class="card">
          <div class="sound">
            <div class="sid ${s.sound ? (s.sound.level < 0.8 ? 'weak' : '') : 'idle'}">${s.sound ? esc((s.sound.meta || '').replace(' ✓', '')) : '—'}</div>
            <div><div class="sname">${s.sound ? esc(s.sound.name) : 'Drag a crate'}</div>
              <div class="smeta">${s.sound ? (s.sound.meta === 'By hand' ? 'Chosen by hand' : /✓/.test(s.sound.meta || '') ? 'Confirmed by drop ✓' : 'Heard just now') : 'Listening…'}</div>
              ${s.sound && s.sound.alts ? `<div class="alts">Close call: ${esc(s.sound.alts)}</div>` : ''}</div>
          </div>
          ${s.crate ? `<div class="crate">${esc(s.crate)}</div>` : ''}
        </div>
        ${v ? `<div class="card verdict">
          <span class="badge ${v.tag}">${{ buy: 'BUY', maybe: 'GAMBLE', skip: 'SKIP' }[v.tag]}</span>
          <span class="profit num ${v.profit >= 0 ? 'good' : 'bad'}">${v.profit >= 0 ? '+' : '−'}${fmt(Math.abs(v.profit))}</span>
          <div class="red"><b class="num ${v.red > 0 ? '' : 'zero'}">${pct(v.red)}%</b><span>red</span></div>
        </div>` : ''}
        ${s.items && s.items.length ? `<div class="card items">${s.items.map(i => `<div class="it" style="--rc:var(--r${i.rarity})"><img src="${esc(i.icon)}" alt="" onerror="this.style.visibility='hidden'"/><span class="n">${esc(i.name)}</span><span class="p num">${i.p !== null ? pct(i.p) + '%' : fmt(i.value)}</span></div>`).join('')}</div>` : ''}`;
    }
  </script>
</body>
</html>
